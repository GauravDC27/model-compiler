[project]
name = "dmc"
version = "0.1.0"
description = "Deterministic Model Compiler: compiler-grade output parity for LLM systems"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
probe = ["torch>=2.4", "transformers>=4.47", "safetensors"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dmc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
